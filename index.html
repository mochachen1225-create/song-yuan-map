<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宋元互動地圖</title>
<meta name="description" content="國中歷史「宋元時期的民族互動」互動地圖：14 站時間軸，看遼、宋、金、元的國界怎麼變。手機、電腦都能玩。">
<!-- 分享到 Threads／Facebook／LINE 時的縮圖和標題 -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://mochachen1225-create.github.io/song-yuan-map/">
<meta property="og:title" content="宋元互動地圖">
<meta property="og:description" content="為女兒做的歷史複習地圖，她說好無聊 XD 送給還沒背起來的同學。14 站時間軸，看遼、宋、金、元的國界怎麼變。">
<meta property="og:image" content="https://mochachen1225-create.github.io/song-yuan-map/docs/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面：地圖鋪滿全螢幕；上方標題列＋圖層切換，下方時間軸；說明卡在時間軸上方（手機）或左側（電腦）。
   單一淺色世界（像一張紙地圖），所以不另做深色模式。 */
:root{
  --sea:#d3e9e8; --land:#f3ead6; --paper:#fbf7ee; --paper2:#f3ecdc; --ink:#2b2a26; --muted:#6f6a5e; --line:#e2d8c3;
  --book:#1f5f8b; --bookbg:#eaf2f8; --imag:#6a4fb0; --imagbg:#f2eefa; --seal:#b5452f;
  --f-disp:"Noto Serif TC","Songti TC","PMingLiU","MingLiU",serif;
  --f-body:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --tl-h:76px;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#d3e9e8;color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-text-size-adjust:100%}
#wrap{position:fixed;inset:0;touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
/* 紙張質感：一層很淡的紙紋＋四周微微變暗，不擋點擊 */
#paper{position:fixed;inset:0;pointer-events:none;z-index:1;mix-blend-mode:multiply;opacity:.5;
  background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,0) 55%,rgba(150,120,70,.22) 100%)}
#paper::after{content:"";position:absolute;inset:0;background-image:var(--grain,none);opacity:.55}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--seal);outline-offset:2px}

/* 上方 */
.bar{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.title{background:var(--paper);border-radius:12px;padding:6px 12px;box-shadow:0 3px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;line-height:1.3}
.title b{font-family:var(--f-disp);font-size:18px;letter-spacing:.08em}
.title span{font-size:11.5px;color:var(--muted)}
.title a{color:var(--book);font-size:12px}
.layers{background:var(--paper);border-radius:999px;padding:4px;display:flex;gap:2px;box-shadow:0 3px 0 rgba(0,0,0,.12);margin-left:auto}
.layers button{border:0;background:none;font-size:14px;padding:6px 12px;border-radius:999px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.layers button i{width:10px;height:10px;border-radius:3px;border:2px solid currentColor;display:inline-block;box-sizing:border-box}
.layers button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.layers button[aria-pressed="true"] i{background:currentColor}
.note{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));background:rgba(43,42,38,.78);color:#fbf7ee;font-size:11.5px;padding:3px 11px;border-radius:999px;white-space:nowrap;z-index:4;pointer-events:none}

/* 縮放 */
.zoom{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(96px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;z-index:5}
.zoom button{width:42px;height:42px;border-radius:12px;border:0;background:var(--paper);font-size:21px;box-shadow:0 3px 0 rgba(0,0,0,.12);cursor:pointer}
.zoom button.sm{font-size:13px}

/* 時間軸 */
.tl{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);box-shadow:0 -3px 0 rgba(0,0,0,.08);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:6px}
.tl .nav{flex:none;width:44px;height:54px;border:0;border-radius:12px;background:var(--paper2);font-size:20px;cursor:pointer}
.tl .nav:disabled{opacity:.35;cursor:default}
.track{flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin;display:flex;gap:4px;position:relative;padding:2px 2px 4px}
.stop{flex:none;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 8px;border-radius:12px;min-width:72px;min-height:56px;position:relative}
.stop::before{content:"";position:absolute;top:21px;left:-4px;right:-4px;height:2px;background:var(--line);z-index:0}
.stop:first-child::before{left:50%}.stop:last-child::before{right:50%}
.stop .yr{font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stop .dot{width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--muted);position:relative;z-index:1}
.stop .nm{font-size:12.5px;white-space:nowrap}
.stop[aria-current="true"]{background:var(--ink);color:var(--paper)}
.stop[aria-current="true"] .yr{color:#f1c27d}
.stop[aria-current="true"] .dot{background:#f1c27d;border-color:#f1c27d}
.stop[aria-current="true"]::before{background:transparent}

/* 說明卡：手機是底部三段式卡片，電腦是左側一欄 */
.sheet{position:fixed;z-index:5;left:0;right:0;bottom:var(--tl-h);background:var(--paper);border-radius:18px 18px 0 0;box-shadow:0 -4px 0 rgba(0,0,0,.08);
  display:flex;flex-direction:column;height:var(--sh-h,46%);transition:height .25s ease}
.sheet[data-mode="peek"]{--sh-h:96px}
.sheet[data-mode="half"]{--sh-h:42%}
.sheet[data-mode="full"]{--sh-h:calc(100% - var(--tl-h) - 56px - env(safe-area-inset-top,0px))}
.sheet[data-mode="peek"] .bd{display:none}
.sheet .hd{position:relative;display:flex;align-items:center;gap:8px;padding:14px max(14px,env(safe-area-inset-right,0px)) 4px max(14px,env(safe-area-inset-left,0px));flex:none;touch-action:none;cursor:grab}
.grab{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:44px;height:5px;border-radius:3px;background:#d5cab3}
.sheet .hd .back{border:0;background:var(--paper2);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.sheet .hd .ttl{flex:1;min-width:0;font-family:var(--f-disp);font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .hd .tog{border:0;background:var(--paper2);border-radius:999px;width:40px;height:32px;cursor:pointer;font-size:14px;flex:none}
.tabs{display:flex;gap:4px;padding:4px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));flex:none;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:var(--paper2);border-radius:10px;padding:8px 4px;font-size:14.5px;cursor:pointer;color:var(--muted);font-weight:600;min-height:40px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.sheet .bd{flex:1;min-height:0;overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.ver-m{display:none}
@media (max-width:620px){
  .title{flex-direction:row;align-items:baseline;gap:8px;padding:6px 10px}
  .title b{font-size:16px}.title #sub{display:none}.ver-m{display:inline;font-size:11px;color:var(--muted)}
  .layers button{padding:6px 10px;font-size:13.5px}
  .note{left:max(10px,env(safe-area-inset-left,0px));transform:none;top:calc(54px + env(safe-area-inset-top,0px));font-size:10.5px}
  .zoom{top:calc(84px + env(safe-area-inset-top,0px))}
  .zoom #zin,.zoom #zout{display:none}
  .zoom button{width:auto;height:32px;padding:0 12px;border-radius:999px}
}
@media (min-width:900px){
  .sheet{left:max(12px,env(safe-area-inset-left,0px));right:auto;width:390px;top:calc(110px + env(safe-area-inset-top,0px));bottom:calc(var(--tl-h) + 12px);height:auto;border-radius:16px;box-shadow:0 5px 0 rgba(0,0,0,.12);transition:none}
  .sheet[data-mode="peek"] .bd{display:flex}
  .sheet .hd{cursor:default;touch-action:auto;padding-top:10px}
  .grab,.sheet .hd .tog{display:none}
  .note{top:calc(70px + env(safe-area-inset-top,0px))}
}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.06em}
.bd h2{margin:0;font-family:var(--f-disp);font-size:22px;line-height:1.3;text-wrap:balance}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;letter-spacing:.06em;padding:2px 9px;border-radius:999px}
.blk{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.blk.book{background:var(--bookbg);border:1.5px solid #bcd3e4}
.blk.book .badge{background:var(--book);color:#fff;align-self:flex-start}
.blk ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.blk li,.blk p{font-size:15px;line-height:1.7;margin:0}
.blk.why{background:#fdf3e2;border:1.5px solid #ecd3a6}
.blk.why .badge{background:#9a6b1f;color:#fff;align-self:flex-start}
.blk.book b{color:var(--book)}
.blk.like{background:#eaf6ee;border:1.5px solid #a9d3b5}
.blk.like .badge{background:#2f7a4c;color:#fff;align-self:flex-start}
.blk.like p{font-size:16px;line-height:1.85}
.blk.like small{color:var(--muted);font-size:12px}
.next-tab{align-self:flex-start;border:1.5px dashed #a996d6;background:#fff;color:var(--imag);border-radius:999px;padding:8px 14px;font-size:14.5px;cursor:pointer;display:flex;gap:6px;align-items:center}
.plist button[aria-pressed="true"]{background:var(--imag);color:#fff;border-style:solid}
.hs{overflow-x:auto}
.role{align-self:flex-start;display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--rc);border:1.5px solid var(--rc);background:#fff}
.pgroups{display:flex;flex-direction:column;gap:10px}
.pg{display:flex;flex-direction:column;gap:6px}
.blk.chain2{background:#fdf3e2;border:1.5px solid #ecd3a6}
.blk.chain2 .badge{background:#9a6b1f;color:#fff;align-self:flex-start}
.blk.chain2 ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.blk.chain2 li{font-size:15px;line-height:1.6;padding-left:1.4em;position:relative}
.blk.chain2 li+li::before{content:"↓";position:absolute;left:.2em;top:-.85em;color:#9a6b1f;font-size:13px}
.blk.chain2 li+li{margin-top:10px}
.mapnote{font-size:13.5px;color:var(--muted);line-height:1.6;margin:0}
.blk.imag{background:var(--imagbg);border:1.5px dashed #a996d6}
.blk.imag .badge{background:var(--imag);color:#fff;align-self:flex-start}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.plist button{border:1.5px dashed #a996d6;background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--imag);display:flex;gap:6px;align-items:center}
.plist button:hover{background:var(--imagbg)}
.pi{width:16px;height:16px;flex:none}
.story{font-size:16px;line-height:1.85;margin:0}
.ask{background:#fff;border-radius:10px;padding:10px 12px;border:1.5px solid #d8cdf0}
.ask b{display:block;font-size:13px;color:var(--imag);letter-spacing:.06em;margin-bottom:2px}
.ask p{font-size:15.5px;line-height:1.7;margin:0}
.ask small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
table.t{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55;background:#fff;border-radius:8px;overflow:hidden}
table.t th,table.t td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--paper2);font-weight:700;white-space:nowrap}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13.5px}
.chain span{padding:3px 8px;border-radius:8px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.chain span.on{border-color:var(--book);color:var(--book);font-weight:700}
.chain em{font-style:normal;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:6px;font-size:13px}
.bars .r{display:grid;grid-template-columns:7.5em 1fr;gap:8px;align-items:center}
.bars .b{display:flex;height:20px;border-radius:6px;overflow:hidden;font-size:11.5px;font-variant-numeric:tabular-nums}
.bars .b span{display:flex;align-items:center;padding:0 5px;white-space:nowrap}
.bars .n{background:#c9b48d;color:#2b2a26}.bars .s{background:#7fae6e;color:#fff;justify-content:flex-end}
.extras{display:flex;flex-wrap:wrap;gap:6px}
.extras button{border:1.5px solid #c9b48d;background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.hint{font-size:13px;color:var(--muted);margin:0}
.ver{font-size:11.5px;color:var(--muted);margin:0}

/* 地圖上的元素 */
.lbl,.mk,.arw,.trade{transition:opacity .7s ease}
.off{opacity:0!important;pointer-events:none!important}
.reg{opacity:0}
.dead{pointer-events:none}
#L-relief image{mix-blend-mode:multiply}
.reg-top{cursor:pointer}
.mk{cursor:pointer}
.mk:hover .pill,.mk:focus .pill{stroke:var(--seal);stroke-width:2}
.far .deco{opacity:0}
.deco{transition:opacity .5s}
.flow{animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-36}}
.pulse{animation:pulse 2s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{opacity:.7;transform:scale(.6)}100%{opacity:0;transform:scale(1.6)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.boat{animation:bob 3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.boat{animation:none}.lbl,.mk,.arw,.trade,.sheet{transition:none}}
</style>
</head><body>

<div id="wrap"><svg id="map" role="img" aria-label="宋元時期互動地圖"></svg></div>
<div id="paper" aria-hidden="true"></div>
<div class="bar">
  <div class="title"><b id="ttl"></b><span id="sub"></span><span id="ver" class="ver-m"></span><span id="homeWrap" hidden><a id="home" href="#">← 回主首頁</a></span></div>
  <div class="layers" role="group" aria-label="圖層">
    <button id="lyPol" aria-pressed="true"><i></i>政權</button>
    <button id="lyTrade" aria-pressed="false"><i></i>商貿</button>
  </div>
</div>
<div class="note" id="note"></div>
<div class="zoom"><button id="zin" aria-label="放大">＋</button><button id="zout" aria-label="縮小">－</button><button id="zre" class="sm" aria-label="回到這一站的範圍">這站</button></div>
<section class="sheet" id="sheet" data-mode="half" aria-live="polite">
  <div class="hd" id="sheetHd"><span class="grab" aria-hidden="true"></span><button class="back" id="back" hidden>← 回到這一站</button><div class="ttl" id="sheetTtl"></div><button class="tog" id="tog" aria-label="展開說明">▴</button></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="這一站的內容"></div>
  <div class="bd" id="sheetBd"></div>
</section>
<nav class="tl" aria-label="時間軸">
  <button class="nav" id="prev" aria-label="上一站">‹</button>
  <div class="track" id="track"></div>
  <button class="nav" id="next" aria-label="下一站">›</button>
</nav>

stations:[
{id:'s947', y:'947', t:'契丹建遼', view:[100,51,128,33],
 regions:[{p:'liao',s:['LIAO'],at:[112,46.5],n:'遼'},{p:'yanyun',s:['YANYUN'],at:[115.4,40],n:'燕雲十六州',small:1},{p:'goryeo',s:['GORYEO'],at:[127.4,37.5],n:'高麗',small:1}],
 places:['dading'], labels:['nuzhen','tubo','mongolp'],
  book:['唐朝滅亡後天下大亂，北方的**契丹人**趁機建立了**遼國**。','遼往南拿下一塊重要的地：**燕雲十六州**。這裡能種田（**農業**價值），也是打仗的好位置（**軍事**價值）。','燕雲十六州在**長城**南邊。遼拿到它，長城就擋不住北方的人了（**長城失去防禦功能**）。'],
 why:'唐朝滅亡、天下大亂 → 契丹趁機建遼、拿下燕雲十六州 → 長城沒用了。',
 like:'長城像學校的圍牆，燕雲十六州是圍牆裡面的一塊操場。遼拿到這塊操場，等於人已經站在圍牆裡面，圍牆再高也擋不住了。',
 mapnote:'橘色是遼，黃色是燕雲十六州，咖啡色虛線是長城。',
 chain:['唐朝滅亡、中原一片混亂，沒人顧得了北方','契丹首領決定趁機擴張','遼建國、拿下燕雲十六州','長城擋不住北方了'],
 people:[
  {n:'燕雲的農夫', r:'百姓', at:[112.4,38.2], story:'我家的田在長城南邊，種了好幾代。最近聽說北方的契丹人建了遼國，連我們這一帶也歸他們管了。田還是一樣種，可是收成要交給誰、會不會又打仗，大家心裡都沒底。', ask:'家鄉換了統治者，你最擔心的會是什麼？'},
  {n:'契丹騎兵', r:'執行', at:[117.5,43.5], story:'以前往南走，總會被長城和守軍擋住。現在燕雲十六州是我們的了，長城就在我們身後。首領說，這片地能種糧，打仗時也是好據點。', ask:'站在契丹人的角度，拿到燕雲十六州最有用的是哪一點？'},
  {n:'契丹的首領', r:'決定', story:'唐朝滅亡以後，中原亂成一團，沒有人管得住北方。這正是我們的機會：建立遼國，再往南拿下燕雲十六州。那裡能種糧，又是打仗的好位置。', ask:'別人很亂的時候，你會趁機擴張嗎？為什麼？'},
  {n:'中原的守將', r:'對手', story:'中原到處都在亂，大家忙著顧自己，沒有人派兵來守北邊。燕雲十六州就這樣落到遼的手上了。', ask:'大家都忙著內鬥的時候，誰最可能得到好處？'}
 ]},

 places:['bianjing','dading','hangzhou','guangzhou'], labels:['tubo','nuzhen','japan'],
  book:['**宋太祖趙匡胤**建立宋朝，首都在**汴京**，歷史上叫**北宋**。','北宋比較重視讀書人（**文人政治**），軍隊的發展就受到影響，所以一直搶不回**燕雲十六州**。'],
 why:'重視讀書人 → 軍事比較弱 → 燕雲十六州拿不回來，北方的遼一直是威脅。',
 like:'像一個班把力氣都花在讀書比賽，體育課很少上。成績很好，可是運動會一直輸給隔壁班。',
 mapnote:'綠色是北宋，首都在汴京。燕雲十六州還在遼的手上。',
 chain:['宋太祖選擇重視讀書人（文人政治）','軍事發展受影響','遼守住燕雲十六州','北宋一直拿不回燕雲，北方的威脅一直在'],
 people:[
  {n:'汴京的讀書人', r:'百姓', at:[111.6,33.4], story:'朝廷看重讀書人，我每天天還沒亮就起來念書，希望有一天能做官。城裡很熱鬧，可是常聽人說，北邊的燕雲十六州還在遼國手上。', ask:'如果你是皇帝，你會先把力氣花在讀書人身上，還是軍隊身上？'},
  {n:'邊境的守軍', r:'執行', at:[117.4,37.3], story:'我守在宋遼交界。往北看，那片土地就是燕雲十六州，現在是遼國的。朝廷一直想拿回來，可是一直沒能做到。', ask:'每天看著拿不回來的土地，你心裡會怎麼想？'},
  {n:'宋太祖趙匡胤', r:'決定', story:'我建立了宋朝，定都汴京。我要讓讀書人來管理國家，這是我選的方向。可是北邊的燕雲十六州還在遼手上，以後要靠誰拿回來呢？', ask:'重視讀書人和重視軍隊，你覺得一個國家能兩個都顧到嗎？'},
  {n:'遼國的貴族', r:'對手', story:'南邊新建了一個宋朝，聽說他們最看重讀書人。只要燕雲十六州在我們手上，宋就很難打過來。', ask:'握著對方拿不回去的土地，有什麼好處？'}
 ]},
{id:'schan', y:'真宗時', t:'澶淵之盟', view:[106,44,125,31],
 regions:[{p:'liao',s:['LIAO'],at:[112,43.5],n:'遼'},{p:'yanyun',s:['YANYUN'],at:[115.4,40],n:'燕雲十六州',small:1},{p:'song',s:['SONGN'],at:[111,33],n:'北宋'},{p:'goryeo',s:['GORYEO'],at:[127.4,37.5],n:'高麗',small:1}],
 places:['chanzhou','bianjing','dading'], labels:[],
 arrows:[{pts:[[116.4,41.2],[116,38.4],[115.2,36.3]], k:'atk', label:'遼軍南下', la:[117.6,38.2]}],
  book:['宋真宗時，**遼**的軍隊打過來，**宋真宗**親自帶兵上前線。最後兩國簽了和約，叫做**「澶淵之盟」**。','約定內容：宋每年送遼銀子和絹，叫做**歲幣**；兩國劃好國界；兩國皇帝**以兄弟互稱**。','意義：兩國地位一樣高，是**對等**的外交關係，和以前的漢人朝代不一樣；宋用錢換來和平（**以財物換取和平**）。','之後兩國一百多年沒有大戰，邊境也恢復做生意。'],
 why:'宋的軍隊打不過遼，打仗又比付歲幣花更多錢 → 乾脆每年付錢換和平。',
 like:'像兩個班一直吵架。A 班決定每年請 B 班喝飲料，換 B 班不來搗亂；兩班班長還說好「我們是兄弟」，誰也不比誰大。',
 mapnote:'紅色箭頭是遼軍南下，旗子是澶州。',
 chain:['宋打不贏，也不想再花大錢打仗','遼拿到好處，也願意停下來','雙方簽下澶淵之盟','一百多年和平，邊境恢復做生意'],
 people:[
  {n:'送歲幣的宋朝官員', r:'執行', at:[111.6,37.2], story:'車上裝的是要送去遼國的銀和絹，以後每年都要送。有人說這很丟臉，可是大家也算過，打仗要花的錢比這多得多。至少邊境安靜下來了。', ask:'花錢換和平，你贊成嗎？為什麼？'},
  {n:'遼國的使節', r:'對手', at:[120.5,41.9], story:'這次和宋朝訂約，兩國君主以兄弟相稱，誰也不比誰低。和中原的王朝這樣平起平坐，可不是常有的事。', ask:'「以兄弟相稱、平起平坐」，對兩個國家來說為什麼重要？'},
  {n:'邊境的商人', r:'百姓', at:[119,36.3], story:'盟約訂了以後，邊境又可以做買賣了。只要不打仗，貨就運得過去，生意越來越好。', ask:'對商人來說，「和平」代表什麼？'},
  {n:'宋真宗', r:'決定', story:'遼軍打到澶州，我親自帶兵上前線。可是朝廷算過，和遼一直打下去花的錢太多。每年付歲幣，換來邊境安穩，你說划不划算？', ask:'如果你是宋真宗，你會繼續打，還是付錢換和平？'},
  {n:'遼國的將領', r:'對手', story:'我們打到這裡，宋的皇帝親自出來了，再打下去我們也會有損失。每年拿銀子和絹，兩國還以兄弟相稱，這樣的條件不錯。', ask:'對遼來說，簽約比繼續打好在哪裡？'}
 ]},
{id:'s1038', y:'1038', t:'西夏建國', view:[96,47,125,28],
 regions:[{p:'liao',s:['LIAO'],at:[113,46.5],n:'遼'},{p:'yanyun',s:['YANYUN'],at:[115.4,40],n:'燕雲十六州',small:1},{p:'song',s:['SONGN'],at:[111,31],n:'北宋'},{p:'xia',s:['XIA'],at:[102.5,40.2],n:'西夏'},{p:'dali',s:['DALI'],at:[100.5,25],n:'大理',small:1},{p:'goryeo',s:['GORYEO'],at:[127.4,37.5],n:'高麗',small:1}],
 places:['xingqing','bianjing','dading'], labels:['tubo','nuzhen'],
  book:['**党項人**在五代時慢慢壯大，**1038年**（北宋中期）建國，國號**大夏**，也叫**西夏**。','遼成了東亞最強的國家，**西夏、女真、高麗**都曾向遼**稱臣納貢**：承認遼比自己大，還要送禮。','北宋除了北邊的遼，西邊、南邊也有威脅；朝廷裡還是有人主張要打仗。'],
 why:'党項人從五代起趁亂壯大 → 北宋中期建國 → 北宋北邊、西邊都有對手。',
 like:'「稱臣納貢」就像小社團每年要向最大的社團報到、送禮，承認「你是老大」。',
 mapnote:'黃色是西夏，都城是興慶府（今銀川）。',
 chain:['党項人從五代起慢慢壯大','首領決定建國','西夏建立','北宋北邊有遼、西邊有西夏；遼成了東亞的老大'],
 people:[
  {n:'党項的首領', r:'決定', at:[104.2,39.2], story:'我們党項人從五代起慢慢壯大，今天終於建立自己的國家，國號大夏。東邊是宋，北邊是強大的遼，我們得小心和兩邊相處。', ask:'夾在兩個大國中間，你會怎麼保護自己的國家？'},
  {n:'北宋朝廷的官員', r:'執行', at:[112.6,35.6], story:'北邊的遼還沒解決，西邊又多了一個西夏。朝廷裡有人主張和，也有人主張打，每天都在爭。', ask:'北邊、西邊都有對手，你會先處理哪一邊？'},
  {n:'遼國的官員', r:'對手', story:'西邊的西夏、東北的女真，還有高麗，都來向我們稱臣納貢。現在遼是東亞的老大，大家都得看我們的臉色。', ask:'當老大的感覺很好，可是你覺得老大的位置能一直坐穩嗎？'},
  {n:'西北邊境的宋朝百姓', r:'百姓', story:'以前只怕北邊的遼，現在西邊也多了西夏。我們的村子在兩個國家中間，大家晚上都睡不太安穩。', ask:'住在兩國交界的地方，你最擔心什麼？'}
 ]},
{id:'s1115', y:'1115', t:'金國建立', view:[104,52,138,30],
 regions:[{p:'liao',s:['LIAO'],at:[110,46.5],n:'遼'},{p:'jin',s:['JINE'],at:[129.5,46],n:'金'},{p:'yanyun',s:['YANYUN'],at:[115.4,40],n:'燕雲十六州',small:1},{p:'song',s:['SONGN'],at:[111,33],n:'北宋'},{p:'xia',s:['XIA'],at:[102.5,40.2],n:'西夏'},{p:'goryeo',s:['GORYEO'],at:[127.4,37.5],n:'高麗',small:1}],
 places:['dading','bianjing'], labels:['japan'],
 arrows:[{pts:[[127,44.5],[124,43],[120.6,42]], k:'atk', label:'金攻遼', la:[124.5,44.4]}],
  book:['北宋晚期，住在**中國東北**的**女真人**建立**金國**。','金國接著一直攻打遼國。'],
 why:'女真原本要向遼稱臣 → 壯大後自己建國 → 反過來打遼。',
 like:'以前每年都要向老大報到的小社團，長大以後自己當老大，回頭挑戰原本的老大。',
 mapnote:'紫色是剛建立的金（在東北）。',
 chain:['女真長期要向遼稱臣','女真勢力變強','首領決定建國、不再當小弟','金國建立，轉頭攻打遼'],
 people:[
  {n:'女真戰士', r:'執行', at:[130.5,44], story:'我們女真人以前要向遼國稱臣。現在我們有了自己的國家，叫做金。首領說，下一步要和遼國一決高下。', ask:'從向別人稱臣到自己建國，你覺得女真人的心情會是什麼？'},
  {n:'遼國的守軍', r:'對手', at:[121.5,44.8], story:'東北的女真人起兵了，消息一天比一天壞。以前他們向我們稱臣，現在卻打過來了。', ask:'如果你是遼國的守軍，聽到這個消息會怎麼想？'},
  {n:'女真的首領', r:'決定', story:'我們女真人一直要向遼稱臣納貢。現在我們夠強了，我決定建立金國，不再當遼的小弟，還要和遼一決高下。', ask:'如果你是首領，什麼時候才是「夠強、可以反抗」的時候？'},
  {n:'東北的女真百姓', r:'百姓', story:'以前每年都要準備東西送去遼國。聽說首領建了金國，以後不用再送了嗎？可是要打仗，家裡的年輕人都要上戰場。', ask:'不用再送禮了，可是要打仗，你覺得值得嗎？'}
 ]},
{id:'s1125', y:'1125', t:'金宋滅遼', view:[100,52,136,30],
 regions:[{p:'jin',s:['JIN6'],at:[124,46.5],n:'金'},{p:'song',s:['SONGN'],at:[111,33],n:'北宋'},{p:'xia',s:['XIA'],at:[102.5,40.2],n:'西夏'},{p:'goryeo',s:['GORYEO'],at:[127.4,37.5],n:'高麗',small:1}],
 places:['dading','bianjing'], labels:[],

  book:['金在打遼的時候，曾經和宋**結盟**，一起打遼。','可是金在一起打仗時發現：**宋軍很弱**。','**1125年**，金和宋一起滅了遼。'],
 why:'金宋聯手滅遼 → 金看出宋軍很弱 → 滅遼以後，金就轉頭打宋（下一站）。',
 like:'兩個人組隊打魔王，打完才發現隊友其實很弱。下一場，原本的隊友就變成對手了。',
 mapnote:'遼消失了，原本遼的土地大多歸金。',
 chain:['宋決定和金同盟','金在戰場上看到宋軍很弱','遼滅亡','金把下一個目標轉向宋'],
 people:[
  {n:'宋軍士兵', r:'執行', at:[113.5,37.5], story:'朝廷和金國約好一起打遼國。可是一上戰場，我們打得很吃力，金兵卻一路勝利。金國的將領看我們的眼神，好像在打量什麼。', ask:'如果盟友發現你很弱，接下來可能會發生什麼事？'},
  {n:'契丹的百姓', r:'百姓', at:[117,44.5], story:'遼國沒了。曾經是北方強權的國家，就這樣倒了。以後我們契丹人要聽金國的了。', ask:'自己的國家滅亡了，你會怎麼面對接下來的生活？'},
  {n:'北宋朝廷的大臣', r:'決定', story:'金國派人來，說要一起打遼。大家討論：和金聯手，遼就會被打敗。只是，我們真的了解金國嗎？', ask:'和一個不熟的新朋友聯手，你會擔心什麼？'},
  {n:'金國的將領', r:'對手', story:'和宋一起打遼，我看得很清楚：宋軍打得很吃力，根本不怎麼樣。等遼滅了，下一個……', ask:'從這位將領的話，你猜下一步會發生什麼事？'}
 ]},
{id:'s1127', y:'1127', t:'靖康之禍・宋室南遷', view:[103,44,125,25],
 regions:[{p:'jin',s:['JIN'],at:[113,38.5],n:'金'},{p:'song',s:['SONGS'],at:[112,27.5],n:'南宋'},{p:'xia',s:['XIA'],at:[102.5,40.2],n:'西夏'},{p:'dali',s:['DALI'],at:[100.5,25],n:'大理',small:1},{p:'goryeo',s:['GORYEO'],at:[127.4,37.5],n:'高麗',small:1}],
 places:['bianjing2','linan','zhongdu'], labels:[],
 arrows:[{pts:[[116.4,39.6],[115.6,37.3],[114.6,35.3]], k:'atk', label:'金兵南下', la:[117.6,37.4]},{pts:[[114.6,34.2],[117,32.3],[119.6,30.8]], k:'move', label:'宋室南遷', la:[116.4,31.7]}],
  book:['金滅了遼以後，轉頭攻打宋。','**1127年**（北宋靖康2年），金攻破首都**汴京**，把宋朝皇室的人抓走，這件事叫**「靖康之禍」**。','剩下的宋朝皇室往南搬（**宋室南遷**），之後的宋叫做**南宋**。'],
 why:'金看出宋軍很弱 → 滅遼後南下打宋、攻破汴京 → 宋室只好往南搬。',
 like:'像學校被別校佔了，校長、主任都被帶走；剩下的老師帶著學生搬到南邊另一個校區重新開學。',
 mapnote:'紅箭頭：金兵南下；藍虛線：宋室南遷到臨安。',
 chain:['金看出宋軍很弱','金決定南下','攻破汴京、俘虜皇室（靖康之禍）','殘存的宋室決定南遷，南宋開始'],
 people:[
  {n:'汴京的百姓', r:'百姓', at:[111.8,33.6], story:'城門被攻破了，街上到處是金兵。聽說皇室的人都被抓走了。昨天還熱熱鬧鬧的街市，今天一片安靜。', ask:'一夜之間城被攻破，你最想先保護什麼？'},
  {n:'女真士兵', r:'對手', at:[112.2,36.9], story:'滅了遼以後，我們發現宋軍不難打，就一路往南。汴京這麼大、這麼繁華，我從來沒見過。', ask:'站在勝利者這一邊，你會怎麼看這座被攻破的城市？'},
  {n:'南逃的讀書人', r:'百姓', at:[118.4,33.4], story:'我帶著家人和幾箱書往南走，聽說殘存的宋室也往南去了。北方的家回不去了，不知道在南方能不能重新開始。', ask:'如果要離開家鄉，只能帶一樣東西，你會帶什麼？'},
  {n:'金國的將領', r:'決定', story:'滅了遼以後，我們發現宋軍不難打。我下令南下，一路打到汴京。城門攻破了，宋朝的皇室都成了我們的俘虜。', ask:'打勝仗的一方，接下來最可能想要什麼？'},
  {n:'南遷的宋朝皇室', r:'決定', story:'汴京沒了，皇室的人被抓走了。剩下的我們只能往南走，到南方重新撐起宋朝。', ask:'首都被攻破了，如果是你，會放棄還是重新開始？'}
 ]},
{id:'speace', y:'和議', t:'金宋和議・南北對峙', view:[99,46,127,20],
 regions:[{p:'jin',s:['JIN'],at:[115,41],n:'金'},{p:'song',s:['SONGS'],at:[112,27.5],n:'南宋'},{p:'xia',s:['XIA'],at:[102.5,40.2],n:'西夏'},{p:'dali',s:['DALI'],at:[100.5,25],n:'大理',small:1},{p:'goryeo',s:['GORYEO'],at:[127.4,37.5],n:'高麗',small:1}],
 places:['linan','zhongdu','bianjing2','xingqing'], labels:['tubo','japan'],
  book:['金一直往南打，但被宋軍擋住，**過不了長江**。','後來金、宋簽了**和議**，一個在北、一個在南，長期對立，叫做**南北對峙**。','和澶淵之盟不一樣：這次是宋要向金**稱臣納貢**，兩國**不對等**。','岳飛〈滿江紅〉寫「**靖康恥，猶未雪**」，意思是靖康之禍的恥辱還沒洗刷。'],
 table:{head:['','關係'], rows:[['澶淵之盟（宋、遼）','以兄弟互稱，外交對等；宋付歲幣'],['金宋和議','宋向金稱臣納貢，不是對等關係']]},
 why:'金過不了長江、宋也打不回北方 → 只好簽和議 → 南北對峙。',
 like:'澶淵之盟像兩個同學平起平坐；金宋和議比較像宋變成小弟，要向老大低頭、交東西。同樣是和平，地位差很多。',
 mapnote:'北邊紫色是金（都城中都），南邊綠色是南宋（都城臨安）。',
 chain:['金一直打不過長江','宋的將領守住防線，也想收復北方','雙方都打不贏對方','簽和議（宋向金稱臣納貢）','長期南北對峙'],
 people:[
  {n:'臨安的商人', r:'百姓', at:[121.3,29.3], story:'北方逃來的人越來越多，臨安城一天比一天熱鬧。這裡沒有打仗，生意還做得下去。只是大家說起北邊的老家，都會嘆氣。', ask:'住在安全的南方，你還會想著北方的家鄉嗎？'},
  {n:'守江的宋軍', r:'執行', at:[114.6,31.3], story:'金兵一次又一次南下，我們守在這裡，就是不讓他們過江。將軍們想收復原來的土地，大家也都記得靖康的恥辱。', ask:'守住防線和打回北方，你覺得哪一個比較重要？'},
  {n:'去金國的宋朝使者', r:'執行', at:[117.4,35.2], story:'這次和議，我們要向金國稱臣、送上貢品。想起以前和遼國訂盟時還能以兄弟相稱，現在卻要低頭。', ask:'同樣是和平，「兄弟相稱」和「稱臣納貢」差在哪裡？'},
  {n:'岳飛', r:'決定', story:'靖康年間的恥辱，到現在還沒洗刷。我帶兵抗金，希望收復原來的土地。我把心裡的憤恨寫成了〈滿江紅〉。', ask:'一邊想打回北方，一邊想議和，如果你是皇帝，你會聽哪一邊？'},
  {n:'金國的將領', r:'對手', story:'我們一次又一次南下，可是宋軍在長江一帶擋得很緊，怎麼都過不去。再打下去也不划算，不如讓宋向我們稱臣、送貢品。', ask:'打不過去的時候，用談判拿到好處，算不算一種贏？'}
 ]},
{id:'smongol', y:'13世紀初', t:'蒙古崛起・第一次西征', view:[46,56,120,28],

 places:['helin','yemili','samarkand'], labels:[],
 arrows:[{pts:[[102.8,47.2],[93,47.3],[83.6,46.5],[74,42],[67,39.6],[58,37.8],[51,38.5],[47.5,43],[50,47.5]], k:'w1', label:'第一次西征（1218～1223）', la:[60,45]}],
  book:['南宋中期（**13世紀初**），**鐵木真**把草原上的各部族統一，建立**蒙古國**。','各部首領尊稱他為**「成吉思汗」**：「成吉思」是蒙古話的「大海」，「汗」是「君主」。','成吉思汗發動**第一次西征**（1218～1223），往西打到很遠的地方。','課本〈兩宋與周邊民族互動演變圖〉：接著**蒙古滅了西夏**。'],
 why:'草原各部統一成一國 → 力量集中 → 開始往外打（西征）。',
 like:'本來各打各的幾個小球隊，被一個很厲害的隊長整合成一支校隊，一下子變成最強的隊伍，開始到外校比賽。',
 mapnote:'粉紅色是蒙古；西夏不見了（蒙古滅西夏）。綠色箭頭是第一次西征。',
 chain:['草原各部原本各打各的','鐵木真把大家統一','蒙古國建立、力量集中','第一次西征、蒙古滅西夏'],
 people:[
  {n:'草原的牧民', r:'百姓', at:[108.5,47.5], story:'以前各部族常常互相爭鬥。現在鐵木真把大家統一了，各部首領都尊稱他「成吉思汗」，意思是像大海一樣的君主。', ask:'許多部族變成一個國家，對牧民來說可能有什麼好處？'},
  {n:'西征的蒙古騎兵', r:'執行', at:[76,45.5], story:'我們從草原一路往西走，翻過山、穿過沙漠，離家越來越遠。眼前的城市和人，長相、說話都和我們不一樣。', ask:'走到這麼遠的地方，你會好奇，還是想家？'},
  {n:'鐵木真（成吉思汗）', r:'決定', story:'草原上的部族以前各打各的。我把大家統一起來，建立蒙古國，各部首領尊稱我為「成吉思汗」。現在我們的力量集中了，要往西走得更遠。', ask:'一群人變成一個團隊之後，力量為什麼會變大？'},
  {n:'西夏的百姓', r:'對手', story:'北方新出現的蒙古越來越強，大軍朝我們打過來了。這次，我們的國家撐不住了。', ask:'旁邊突然出現一個很強的國家，小國會怎麼樣？'}
 ]},
{id:'s1234', y:'1234', t:'蒙古與南宋滅金', view:[96,51,128,22],

  book:['**1234年**，**蒙古和南宋合作**，一起滅了**金**。','之後蒙古取代金，統治**黃河流域**。'],
 why:'蒙古、南宋兩邊夾擊 → 金滅亡 → 蒙古直接變成南宋的鄰居。',
 like:'你和新朋友聯手打敗了一直欺負你的人，結果發現這個新朋友比原本那個人還強，而且就住你家隔壁。',
 mapnote:'金消失了，蒙古的範圍一路到淮河一帶，和南宋接壤。',
 chain:['南宋決定和蒙古合作','蒙古也要打金','金被兩邊夾擊而滅亡','蒙古統治黃河流域，和南宋直接相鄰'],
 people:[
  {n:'出兵的南宋將士', r:'執行', at:[111.8,30.1], story:'我們和蒙古約好一起打金國。靖康的恥辱，總算可以報了。只是打完以後，北邊的鄰居就換成了蒙古。', ask:'打敗老對手以後，新鄰居更強，你會開心還是擔心？'},
  {n:'黃河邊的百姓', r:'百姓', at:[116.6,36.2], story:'這裡先是宋，後來是金，現在換成蒙古。統治的人一直換，我們還是在這條河邊種田過日子。', ask:'統治者一直換，對一般百姓來說，什麼事最重要？'},
  {n:'南宋朝廷的官員', r:'決定', story:'蒙古派人來，說要一起打金。金是我們的老對手，靖康的恥辱還記在心裡。和蒙古合作，就能打敗金。', ask:'為了打敗老對手，和一個更強的新勢力合作，你覺得有沒有風險？'},
  {n:'蒙古的將領', r:'決定', story:'和南宋一起打金，金很快就倒了。現在黃河流域都歸我們管，南邊就是南宋。', ask:'從他的話，你猜蒙古下一個目標是誰？'},
  {n:'金國的士兵', r:'對手', story:'北邊是蒙古，南邊是南宋，兩邊一起打過來。我們被夾在中間，撐不下去了。', ask:'被兩邊夾攻的時候，還有什麼辦法？'}
 ]},

  book:['成吉思汗和後來的君主一共發動**三次西征**：1218～1223、1235～1241、1252～1260。','在打下的地方建立**四大汗國**：**欽察、窩闊臺、察合臺、伊兒汗國**。','蒙古變成**橫跨歐洲、亞洲**的大帝國。'],

 people:[
  {n:'西亞城裡的商人', r:'對手', at:[46,29.8], story:'聽說從東方很遠的草原，來了一支大軍，一路往西打到這裡。市場上的商人都在討論：以後往東方的路，是更危險，還是更好走？', ask:'一個帝國從東亞連到西亞，對做生意的人是好事還是壞事？'},
  {n:'遠征的蒙古士兵', r:'執行', at:[38,51.5], story:'我離開草原已經好多年了。我們在這裡建了汗國，往西還有更多城市。從這裡騎馬回家鄉，要走很久很久。', ask:'離家這麼遠打仗，你最想念家鄉的什麼？'},
  {n:'成吉思汗的繼位者', r:'決定', story:'祖先開始的西征，我們要繼續。一次又一次往西，打下的地方就建立汗國。', ask:'一直往外打，對蒙古有什麼好處？可能又有什麼壞處？'},
  {n:'歐洲城市的居民', r:'百姓', story:'從東方來的騎兵到了我們這裡。他們說的話、穿的衣服，都和我們完全不一樣。', ask:'第一次遇到完全不認識的民族，你會害怕還是好奇？'}
 ]},
{id:'s1271', y:'1271', t:'忽必烈建元', view:[96,50,135,17],
 regions:[{p:'mongol',s:['MONGOL','JIN'],at:[104,45],n:'元'},{p:'song',s:['SONGS'],at:[112,27.5],n:'南宋'},{p:'dali',s:['DALI'],at:[100.5,25],n:'大理',small:1},{p:'goryeo',s:['GORYEO'],at:[127.4,37.5],n:'高麗',small:1}],

 arrows:[{pts:[[127.3,36.4],[129.4,35],[131,33.9]], k:'atk', label:'攻打日本', la:[131.6,36.6]},{pts:[[108.2,26.5],[106.8,23.6],[105.9,21.5]], k:'atk', label:'攻打安南', la:[104.6,23.6]},{pts:[[112.4,35],[112.3,32.4]], k:'atk', label:'南下侵宋', la:[110,33.7]}],
  book:['鐵木真的孫子**忽必烈**即位，建立**元朝**，首都在**大都**（今天的北京），他就是**元世祖**。','忽必烈除了往南打宋，也**控制了高麗**，還派兵攻打**日本**和**安南**（越南北部）。'],
 why:'蒙古已經統治黃河流域 → 忽必烈建立元朝、定都大都 → 接著往南打宋。',
 like:'連鎖店在東亞的總店換上新招牌「元」，總部設在大都，還想把附近的店都收進來。',
 mapnote:'粉紅色改叫「元」，都城是大都。',
 chain:['忽必烈即位，決定建立元朝、定都大都','繼續往外擴張','控制高麗、攻打日本和安南','南下侵宋'],
 people:[
  {n:'大都的工匠', r:'百姓', at:[118,40.9], story:'新的都城叫大都，到處都在蓋房子、修路。我每天搬磚、刻木頭，城裡來來往往的人，說著好多種不同的話。', ask:'在一座剛建好的都城裡，你最想看到什麼？'},
  {n:'高麗的使者', r:'對手', at:[126.2,36.1], story:'忽必烈控制了我們高麗。我這次到大都，是去聽元朝的命令。聽說元朝也要派兵去打日本。', ask:'一個小國要和大帝國相處，你會怎麼做？'},
  {n:'忽必烈', r:'決定', story:'我是鐵木真的孫子。我即位後建立元朝，把都城定在大都。南邊還有南宋，東邊還有高麗、日本，我要讓更多地方歸元朝管。', ask:'一個已經很大的國家，為什麼還想變得更大？'},
  {n:'南宋的守將', r:'對手', story:'北邊的蒙古建立了元朝，忽必烈的大軍正在往南打。我們還守得住嗎？', ask:'知道對手越來越強，你會怎麼準備？'}
 ]},
{id:'s1279', y:'1279', t:'元滅南宋・四等人', view:[96,50,128,18],
 regions:[{p:'mongol',s:['MONGOL','JIN','SONGS','DALI'],at:[104,44],n:'元'},{p:'goryeo',s:['GORYEO'],at:[127.4,37.5],n:'高麗',small:1}],
 places:['dadu','linan','helin'], labels:['japan','annan'],
 arrows:[{pts:[[114.5,33],[116.6,31.4],[119.6,30.5]], k:'atk', la:[117,33.8], label:'元滅南宋'},{pts:[[112.6,31.5],[112.8,27],[113.2,23.6]], k:'atk'}],
  book:['元朝往南滅了宋，連**長江以南**也統治了；蒙古人成為**第一個統治全中國的草原民族**。','為了讓蒙古人的權力更穩，元朝把人民分成**四個等級**（見下表）。','**蒙古人**和**色目人**有比較多特權；**漢人**和**南人**在政治、法律、**科舉**上被限制很多。'],
 table:{head:['等級','是誰・地位'], rows:[['蒙古人','地位最高，擔任重要官職'],['色目人','指西域各民族，大多負責財政職務'],['漢人','原受金國統治的漢人、契丹人、女真人，許多方面受到限制'],['南人','原受南宋統治的人民與其他南方各族，地位最低']]},
 why:'元統治全中國 → 為了保住蒙古人的權力 → 把人民分成四等。',
 like:'像學校把學生分成四種身分：第一種當幹部、拿最多好處；第二種管班費；第三、第四種做什麼都被限制，最後一種地位最低。',
 mapnote:'南宋消失，元統治全中國。',
 chain:['忽必烈南下滅宋、統治全中國','決定用四等人鞏固蒙古人的權力','蒙古人、色目人有特權','漢人、南人處處受限制'],
 people:[
  {n:'南人讀書人', r:'百姓', at:[118.6,28.4], story:'以前在南宋，我認真讀書，希望考科舉做官。改朝換代以後，我們被叫做「南人」，是地位最低的一等，考試、做官處處受到限制。', ask:'同一個國家裡，人被分成四等，你覺得公平嗎？如果你是南人，會怎麼想？'},
  {n:'色目人官員', r:'執行', at:[111.4,36.2], story:'我從西域來，因為會算帳、懂財政，被派來管錢糧。朝廷給我們色目人不少特權，可是我也感覺得到，很多漢人、南人心裡不服氣。', ask:'拿到特權的人，心裡會不會也有不安？'},
  {n:'蒙古官員', r:'執行', at:[118.3,41.4], story:'我們蒙古人地位最高，重要的官職都由我們擔任。可是要管這麼大的國家、這麼多不同的人，真不容易。', ask:'如果你是統治者，要怎麼讓不同的人都願意配合你？'},
  {n:'忽必烈', r:'決定', story:'南宋滅了，整個中國都歸元朝管了。為了讓蒙古人的權力穩穩的，我把人民分成四個等級：蒙古人、色目人、漢人、南人。', ask:'用分等級的方法管理國家，你覺得會有什麼問題？'},
  {n:'北方的漢人農夫', r:'百姓', story:'我住在北方，以前歸金國管，現在被叫做「漢人」。地位比蒙古人、色目人低，很多事都被限制。', ask:'被分到第三等，你會怎麼想？'}
 ]},
{id:'send', y:'14世紀中葉', t:'元朝滅亡', view:[96,50,128,18],
 regions:[{p:'mongol',s:['MONGOL','JIN','SONGS','DALI'],at:[104,44],n:'元',faded:1},{p:'goryeo',s:['GORYEO'],at:[127.4,37.5],n:'高麗',small:1}],
 places:['dadu'], labels:['japan'],
  book:['元朝後期，政府的錢管得一團亂（**財政紊亂**），人民要繳的稅和要做的工很重（**賦役繁重**），又一直有天災（**連年災荒**）。','人民紛紛起來反抗（**民變紛起**），元朝最後在**14世紀中葉**滅亡。'],
 why:'財政亂 ＋ 稅和勞役重 ＋ 連年災荒 → 人民活不下去、起來反抗 → 元朝滅亡。',
 like:'像一個班費帳亂七八糟、又一直加收錢的班級，再碰上連續出事，大家終於受不了，一起反對幹部。',
 mapnote:'元的範圍變淡：元朝走向滅亡。',
 chain:['朝廷財政紊亂、加重賦役','連年災荒','百姓活不下去','民變紛起','元朝滅亡'],
 people:[

  {n:'收稅的小官', r:'執行', at:[119.8,31.6], story:'上面一直催著收錢，國庫還是不夠用，帳目亂成一團。我到村子裡收稅，看見的都是挨餓的人。', ask:'如果你是這個小官，會照命令收稅，還是向上面說實話？'},

<script>
/* =====================================================================
   程式區（ENGINE）：只讀 window.MAP_DATA，畫地圖、時間軸、說明卡。
   v2：底圖改用內嵌的 Natural Earth（window.NE_BASE，由 tools/build.sh 產生），用內嵌的 D3 投影和繪製；
   政權國界仍是 MAP_DATA.shapes，只是裁切到真實陸地。
   ===================================================================== */
(function(){
'use strict';
const D=window.MAP_DATA;
const NS='http://www.w3.org/2000/svg';
/* 投影：D3 的蘭伯特正形圓錐投影（參數跟底圖一起放在 NE_BASE.proj），所以經緯線是有弧度的，像真的地圖 */
const NE=window.NE_BASE;
const proj=d3.geoConicConformal().parallels(NE.proj.parallels).rotate(NE.proj.rotate).scale(NE.proj.scale).translate([0,0]);
const geo=d3.geoPath(proj);
const XY=p=>{const q=proj(p);return[+q[0].toFixed(1),+q[1].toFixed(1)];};
const PTS=a=>a.map(p=>XY(p).join(',')).join(' ');
const svg=document.getElementById('map');
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);if(a)for(const n in a)e.setAttribute(n,a[n]);(p||svg).appendChild(e);return e;};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 標題 ---------- */
$('ttl').textContent=D.meta.title;
$('sub').textContent=D.meta.sub+'・'+D.meta.version+'（'+D.meta.date+'）';$('ver').textContent=D.meta.version+'・'+D.meta.date;
$('note').textContent=D.meta.note;
document.title=D.meta.title;
if(location.protocol==='file:'&&D.meta.home){$('home').href=D.meta.home;$('homeWrap').hidden=false;}

/* 紙紋：開頁時用 canvas 隨機點出一小塊，當背景重複鋪 */
try{const c=document.createElement('canvas');c.width=c.height=140;const x=c.getContext('2d');const im=x.createImageData(140,140);
  for(let i=0;i<im.data.length;i+=4){const v=200+Math.random()*55;im.data[i]=v;im.data[i+1]=v*.97;im.data[i+2]=v*.9;im.data[i+3]=Math.random()<.5?40:0;}
  x.putImageData(im,0,0);document.documentElement.style.setProperty('--grain','url('+c.toDataURL()+')');}catch(e){}

/* ---------- 圖層 ---------- */
const defs=el('defs');
const wave=el('pattern',{id:'wave',width:46,height:22,patternUnits:'userSpaceOnUse'},defs);
el('path',{d:'M2 12 q5 -4 10 0 t10 0',fill:'none',stroke:'#fff',opacity:.45,'stroke-width':1.2,'stroke-linecap':'round'},wave);
const sand=el('pattern',{id:'sand',width:9,height:9,patternUnits:'userSpaceOnUse'},defs);
el('circle',{cx:2,cy:2,r:.9,fill:'#c9a96a',opacity:.55},sand);el('circle',{cx:6.5,cy:6.5,r:.7,fill:'#c9a96a',opacity:.45},sand);
const L={};
['sea','grat','coast','landSh','land','desert','regSh','reg','relief','lake','river','deco','tradeL','arrow','lbl','mk','people','tradeM'].forEach(n=>L[n]=el('g',{id:'L-'+n}));

/* 會跟著縮放保持同樣螢幕大小的東西（圖示、字） */
const marks=[];
function mark(g,lonlat,opt){const[x,y]=XY(lonlat);const m={e:g,x,y,k:(opt&&opt.k)||1,r:(opt&&opt.r)||0};marks.push(m);return m;}

/* ---------- 底圖（Natural Earth，用 D3 畫） ---------- */
const landD=geo(NE.land);
d3.select(L.sea).call(g=>{
  g.append('rect').attr('x',-9000).attr('y',-9000).attr('width',20000).attr('height',20000).attr('fill','#d3e9e8');
  g.append('rect').attr('x',-9000).attr('y',-9000).attr('width',20000).attr('height',20000).attr('fill','url(#wave)');
});
/* 經緯線：淡淡的，讓它像一張地圖 */
d3.select(L.grat).append('path').attr('d',geo(d3.geoGraticule().extent([[10,-20],[170,80]]).step([10,10])()))
  .attr('fill','none').attr('stroke','#fff').attr('stroke-opacity',.55).attr('stroke-width',1).attr('vector-effect','non-scaling-stroke');
/* 海岸外面一圈一圈的水紋線（紙地圖的畫法） */
d3.select(L.coast).selectAll('path').data([[17,'#c2dfde'],[12,'sea'],[6,'#c6e2e1']]).join('path')
  .attr('d',landD).attr('fill','none').attr('stroke',d=>d[1]==='sea'?'#d3e9e8':d[1]).attr('stroke-width',d=>d[0]).attr('stroke-linejoin','round').attr('vector-effect','non-scaling-stroke');
d3.select(L.landSh).append('path').attr('d',landD).attr('fill','#c9bc9c');
d3.select(L.land).append('path').attr('d',landD).attr('fill','#f3ead6').attr('stroke','#7fa3a3').attr('stroke-width',1.1).attr('stroke-linejoin','round').attr('vector-effect','non-scaling-stroke');
/* 陸地的形狀當作裁切範圍：國界、沙漠、山脈陰影都只畫在陸地上 */
d3.select(defs).append('clipPath').attr('id','landClip').append('path').attr('d',landD);
d3.select(L.desert).attr('clip-path','url(#landClip)').call(g=>{
  const dd=geo(NE.deserts);
  g.append('path').attr('d',dd).attr('fill','#ecdcb4');g.append('path').attr('d',dd).attr('fill','url(#sand)');
});
/* 山脈陰影：用 multiply 疊在陸地和國界上（裁切要加在 image 自己身上，加在外層 g 會讓混色失效） */
d3.select(L.relief).append('image').attr('clip-path','url(#landClip)').attr('href',NE.relief.src)
  .attr('x',NE.relief.x).attr('y',NE.relief.y).attr('width',NE.relief.w).attr('height',NE.relief.h).attr('preserveAspectRatio','none');
d3.select(L.lake).selectAll('path').data(NE.lakes.features).join('path').attr('d',geo)
  .attr('fill','#d3e9e8').attr('stroke','#7fa3a3').attr('stroke-width',.8).attr('vector-effect','non-scaling-stroke');
/* 舊示意圖的「陸地」範圍（MAP_DATA.base.land／seas）：國界形狀是沿著它的海岸描的。
   真實海岸比示意海岸凸出去的地方，讓國界往外補一點（只補在舊圖的海上），再裁切到真實陸地，邊就會貼齊海岸。
   用一條 evenodd 的裁切路徑表示「舊圖的海」：大方框 − 舊陸地 ＋ 舊陸地裡的海；
   島（第二塊以後）用外擴的外框，免得大陸國界的補邊跑到附近的島上（例如海南島、臺灣）。 */
const EXT=15;/* 往海那邊補多寬（地圖單位；1 緯度約 20） */
{const ring=pts=>'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')+'Z';
  let d='M-9000,-9000H11000V11000H-9000Z';
  D.base.land.forEach((p,i)=>{const q=p.map(XY);
    if(!i){d+=ring(q);return;}
    const c=[];q.forEach(([x,y])=>{for(let a=0;a<12;a++)c.push([x+EXT*Math.cos(a*Math.PI/6),y+EXT*Math.sin(a*Math.PI/6)]);});
    d+=ring(d3.polygonHull(c));});
  D.base.seas.forEach(p=>d+=ring(p.map(XY)));
  d3.select(defs).append('clipPath').attr('id','oldSea').append('path').attr('d',d).attr('clip-rule','evenodd');}

/* 河、長城 */
const lineD=pts=>pts.map((p,i)=>(i?'L':'M')+XY(p).join(' ')).join(' ');
function txt(parent,lonlat,s,o){
  const g=el('g',{class:o.cls||''},parent);
  const t=el('text',{x:0,y:0,'text-anchor':'middle','dominant-baseline':'middle','font-size':o.size||12,'font-family':o.disp?'var(--f-disp)':'var(--f-body)','font-weight':o.w||600,fill:o.c||'#2b2a26',stroke:o.halo===false?'none':'rgba(255,253,246,.92)','stroke-width':o.halo===false?0:4,'stroke-linejoin':'round','paint-order':'stroke','letter-spacing':o.ls||0},g);
  t.textContent=s;mark(g,lonlat);return g;
}
/* 黃河、長江：Natural Earth 的河道；河名位置照 MAP_DATA */
d3.select(L.river).selectAll('g.rv').data(NE.rivers.features).join('g').attr('class','rv').call(g=>{
  g.append('path').attr('d',geo).attr('fill','none').attr('stroke','#fff').attr('stroke-opacity',.7).attr('stroke-width',5.5);
  g.append('path').attr('d',geo).attr('fill','none').attr('stroke','#5f9fb3').attr('stroke-width',2.6);
}).selectAll('path').attr('vector-effect','non-scaling-stroke').attr('stroke-linecap','round').attr('stroke-linejoin','round');
D.base.rivers.forEach(r=>txt(L.river,r.at,r.n,{size:12.5,c:'#245e72'}));
{const w=D.base.wall;
  el('path',{d:lineD(w.pts),fill:'none',stroke:'#fff','stroke-width':5,opacity:.6,'vector-effect':'non-scaling-stroke','stroke-linecap':'round'},L.river);
  el('path',{d:lineD(w.pts),fill:'none',stroke:'#8a6f52','stroke-width':3,'stroke-dasharray':'4 3','vector-effect':'non-scaling-stroke'},L.river);
  txt(L.river,w.at,w.n,{size:11,c:'#6b5640'});}

/* 裝飾小圖示 */
const DECO={

  for(const m of marks)m.e.setAttribute('transform','translate('+m.x+','+m.y+') scale('+(s*m.k*shrink).toFixed(4)+')'+(m.r?' rotate('+m.r.toFixed(1)+')':''));

function freeArea(){

/* view 是經緯度方框 [西, 北, 東, 南]；圓錐投影下方框會變成扇形，所以沿著四邊取點，算出在地圖上的範圍 */
function boxXY(b){
  const pts=[];for(let i=0;i<=8;i++){const t=i/8,lo=b[0]+(b[2]-b[0])*t,la=b[3]+(b[1]-b[3])*t;pts.push(proj([lo,b[1]]),proj([lo,b[3]]),proj([b[0],la]),proj([b[2],la]));}
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);

}

  const s=Math.max((x2-x1)/A.w,(y2-y1)/A.h);
  const cx=(x1+x2)/2,cy=(y1+y2)/2;
  return{x:cx-(A.left+A.w/2)*s,y:cy-(A.top+A.h/2)*s,w:A.W*s,h:A.H*s};
}
let anim=0;
function flyTo(b){
  const to=camFor(b),from={...vb};cancelAnimationFrame(anim);
  if(reduce){vb=to;setVB();return;}
  const t0=performance.now(),dur=750;
  const step=t=>{let u=Math.min(1,(t-t0)/dur);u=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    vb={x:from.x+(to.x-from.x)*u,y:from.y+(to.y-from.y)*u,w:from.w+(to.w-from.w)*u,h:from.h+(to.h-from.h)*u};setVB();
    if(u<1)anim=requestAnimationFrame(step);};
  anim=requestAnimationFrame(step);
}
function zoom(f,cx,cy){
  const s=vb.w/svg.clientWidth;const ns=Math.min(12,Math.max(.12,s*f));const kk=ns/s;
  if(cx==null){cx=vb.x+vb.w/2;cy=vb.y+vb.h/2;}
  vb={x:cx-(cx-vb.x)*kk,y:cy-(cy-vb.y)*kk,w:vb.w*kk,h:vb.h*kk};setVB();
}
const toSvg=(px,py)=>{const r=svg.getBoundingClientRect();const s=vb.w/r.width;return[vb.x+(px-r.left)*s,vb.y+(py-r.top)*s,s];};
$('zin').onclick=()=>{userMoved=true;zoom(.7);};$('zout').onclick=()=>{userMoved=true;zoom(1/.7);};
$('zre').onclick=()=>{userMoved=false;flyTo(curView());};
svg.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);const[cx,cy]=toSvg(e.clientX,e.clientY);zoom(e.deltaY>0?1.12:1/1.12,cx,cy);},{passive:false});
const ptrs=new Map();let pinchD=null,moved=0,dragged=false;
svg.addEventListener('pointerdown',e=>{userMoved=true;ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;dragged=false;pinchD=null;cancelAnimationFrame(anim);});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===1){const s=vb.w/svg.clientWidth;vb.x-=(e.clientX-prev[0])*s;vb.y-=(e.clientY-prev[1])*s;moved+=Math.abs(e.clientX-prev[0])+Math.abs(e.clientY-prev[1]);if(moved>6)dragged=true;setVB();}
  else if(ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(pinchD){const[cx,cy]=toSvg((a[0]+b[0])/2,(a[1]+b[1])/2);zoom(pinchD/d,cx,cy);}pinchD=d;dragged=true;}
});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinchD=null;};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);svg.addEventListener('pointerleave',up);

/* ---------- 說明卡 ----------
   手機：三段高度（peek 只露標題和頁籤／half 一半／full 幾乎全螢幕），拉把手或點標題切換；左右滑換站。
   每站分三個頁籤：課本、打個比方、當時的人。 */
const sheet=$('sheet'),bd=$('sheetBd'),tabs=$('tabs');
let cur=0,tradeOn=false,polOn=true,tab='book',personSel=-1,onStation=true,userMoved=false;
const curView=()=>tradeOn?D.trade.view:D.stations[cur].view;
const isPhone=()=>innerWidth<900;
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const list=a=>'<ul>'+a.map(s=>'<li>'+rich(s)+'</li>').join('')+'</ul>';
const tableH=t=>'<div class="hs"><table class="t"><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map((c,i)=>i?'<td>'+esc(c)+'</td>':'<th>'+esc(c)+'</th>').join('')+'</tr>').join('')+'</tbody></table></div>';
const likeH=s=>'<div class="blk like"><span class="badge">打個比方</span><p>'+esc(s)+'</p><small>比喻是幫助理解，不是歷史事實。</small></div>';
const roleChip=r=>{const o=D.roles&&D.roles[r];return o?'<span class="role" style="--rc:'+o.c+'">'+esc(o.n)+'</span>':'';};
const PI='<svg class="pi" viewBox="-12 -21 24 24" aria-hidden="true"><circle cx="0" cy="-9" r="11" fill="#6a4fb0"/><circle cx="0" cy="-12.5" r="3.2" fill="#fff"/><path d="M-5.5 -3.5 Q-5.5 -9 0 -9 Q5.5 -9 5.5 -3.5 Z" fill="#fff"/></svg>';
function setMode(m){
  sheet.dataset.mode=m;const t=$('tog');t.textContent=m==='full'?'▾':'▴';t.setAttribute('aria-label',m==='full'?'收起說明':'展開說明');
  if(!userMoved)setTimeout(()=>flyTo(curView()),260);
}
function ensureOpen(){if(isPhone()&&sheet.dataset.mode==='peek')setMode('half');}
function openSheet(title,html,sub){
  onStation=!sub;
  $('sheetTtl').textContent=title;bd.innerHTML=html;bd.scrollTop=0;
  $('back').hidden=!sub;tabs.hidden=!!sub;
  bd.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>showPerson(cur,+b.dataset.person));
  bd.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>showTrade(b.dataset.card));
  bd.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;showStation();});
}
const TABS=[['book','課本'],['like','打個比方'],['people','當時的人']];
tabs.innerHTML=TABS.map(([k,n])=>'<button role="tab" data-t="'+k+'">'+n+'</button>').join('');
tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;if(tab!=='people')personSel=-1;ensureOpen();showStation();});
function showStation(){
  const st=D.stations[cur];
  tabs.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.t===tab)));
  let h='<div class="eyebrow">第 '+(cur+1)+' 站／共 '+D.stations.length+' 站・'+esc(st.y)+'</div><h2>'+esc(st.t)+'</h2>';
  if(tab==='book'){
    h+='<div class="blk why"><span class="badge">為什麼會這樣？</span><p>'+esc(st.why)+'</p></div>';
    h+='<div class="blk book"><span class="badge">課本重點</span>'+list(st.book)+(st.table?tableH(st.table):'')+'</div>';
    if(st.mapnote)h+='<p class="mapnote">地圖：'+esc(st.mapnote)+'點國家可以看它在〈綜合比較〉表裡的那一列。</p>';
    if(tradeOn)h+=tradeIntro();
    if(D.meta.legend)h+='<p class="mapnote">'+esc(D.meta.legend)+'</p>';
    h+='<p class="ver">'+esc(D.meta.title)+' '+esc(D.meta.version)+'（'+esc(D.meta.date)+'）・內容依國中歷史課程整理</p><p class="ver">底圖：Natural Earth（公有領域）・地圖程式：D3.js（ISC 授權）</p>';
  }else if(tab==='like'){
    h+=st.like?likeH(st.like):'<p class="hint">這一站還沒有比喻。</p>';
    h+='<button class="next-tab" data-tab="people">'+PI+'聽聽當時的人怎麼說 →</button>';
  }else{
    const ps=st.people||[];
    const chainH=st.chain?'<div class="blk chain2"><span class="badge">大家的選擇，串起來</span><ol>'+st.chain.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ol></div>':'';
    if(personSel>=0&&ps[personSel]){const p=ps[personSel];
      h+='<div class="blk imag"><span class="badge">情境想像（不是課本內容）</span>'+roleChip(p.r)+'<h2 style="font-size:20px">'+esc(p.n)+'</h2><p class="story">「'+esc(p.story)+'」</p>'+
        '<div class="ask"><b>如果是你</b><p>'+esc(p.ask)+'</p><small>想一想就好，不用寫答案。</small></div></div>';}
    else h+='<p class="hint">歷史是很多人的選擇加起來的。點一個人，聽聽他的想法；地圖上的紫色人物也可以點。這些是想像的故事，不是課本內容，不用背。</p>'+chainH;
    const order=Object.keys(D.roles||{});
    const groups=order.map(r=>[r,ps.map((p,i)=>[p,i]).filter(([p])=>p.r===r)]).filter(g=>g[1].length);
    const other=ps.map((p,i)=>[p,i]).filter(([p])=>!p.r||!order.includes(p.r));
    if(other.length)groups.push(['',other]);
    h+='<div class="pgroups">'+groups.map(([r,arr])=>'<div class="pg">'+(r?roleChip(r):'')+'<div class="plist">'+arr.map(([p,i])=>'<button data-person="'+i+'"'+(i===personSel?' aria-pressed="true"':'')+'>'+PI+esc(p.n)+'</button>').join('')+'</div></div>').join('')+'</div>';
    if(personSel>=0)h+=chainH;
  }
  openSheet(st.y+'・'+st.t,h,false);
}
function tradeIntro(){
  return '<div class="blk book"><span class="badge">商貿圖層</span><p>藍色點線是海路（宋元），咖啡色線是陸路（元）。點路線或地點看重點。</p><div class="extras">'+D.trade.extras.map(x=>'<button data-card="'+x.card+'">'+esc(x.n)+'</button>').join('')+'</div></div>';
}
function showPerson(si,pi){tab='people';personSel=pi;ensureOpen();showStation();}
function showPolity(pid){
  const po=D.polities[pid];const C=D.compare;let h='<div class="eyebrow">政權</div><h2 style="display:flex;gap:8px;align-items:center"><span style="width:16px;height:16px;border-radius:4px;background:'+po.fill+';border:2px solid '+po.side+'"></span>'+esc(po.n)+'</h2>';
  if(po.row){const r=C.rows[po.row];
    h+='<div class="blk book"><span class="badge">課本〈綜合比較〉宋元時期各政權興衰</span><div class="hs"><table class="t"><tbody><tr><th>政權</th><td>'+esc(r.name)+'</td></tr>'+C.cols.map(c=>'<tr><th>'+esc(c)+'</th><td>'+esc(r[c])+'</td></tr>').join('')+
      '</tbody></table></div><b style="font-size:13px">外交關係（這一列四個政權共用）</b><p class="hint">藍色＝'+esc(r.name)+'有參與的；灰色＝'+esc(r.name)+'沒有參與的。</p><div class="chain">'+C.diplo.map((d,i)=>(i?'<em>→</em>':'')+'<span class="'+(d.who.includes(po.row)?'on':'')+'">'+esc(d.t)+'</span>').join('')+'</div></div>';}
  if(po.info)h+='<div class="blk book"><span class="badge">課本</span>'+list(po.info)+'</div>';
  if(po.note)h+='<p class="hint">'+esc(po.note)+'</p>';
  ensureOpen();openSheet(po.n,h,true);
}
function showPlace(id){const p=D.places[id];ensureOpen();openSheet(p.n,'<div class="eyebrow">地點</div><h2>'+esc(p.n)+'</h2><div class="blk book"><span class="badge">課本</span>'+list(p.info||[])+'</div>',true);}
function showTrade(cid){
  const c=D.trade.cards[cid];let h='<div class="eyebrow">商貿・'+esc(c.tag)+'</div><h2>'+esc(c.t)+'</h2><div class="blk book"><span class="badge">課本</span>';
  if(c.body)h+=list(c.body);
  if(c.table)h+=tableH(c.table);
  if(c.bars)h+='<b style="font-size:13px">'+esc(c.bars.t)+'</b><div class="bars">'+c.bars.rows.map(r=>'<div class="r"><span>'+esc(r[0])+'</span><div class="b"><span class="n" style="width:'+r[1]+'%">北 '+r[1]+'</span><span class="s" style="width:'+r[2]+'%">南 '+r[2]+'</span></div></div>').join('')+'</div>';
  h+='</div>'+(c.like?likeH(c.like):'')+'<div class="extras">'+D.trade.extras.filter(x=>x.card!==cid).map(x=>'<button data-card="'+x.card+'">'+esc(x.n)+'</button>').join('')+'</div>';
  ensureOpen();openSheet(c.t,h,true);
}
$('back').onclick=showStation;
const ORDER=['peek','half','full'];
$('tog').onclick=e=>{e.stopPropagation();const m=sheet.dataset.mode;setMode(m==='full'?'peek':ORDER[ORDER.indexOf(m)+1]);};
/* 拉把手：往上拉變大、往下拉變小，點一下在 收起／一半 之間切換 */
{let y0=null,t0=0;const hd=$('sheetHd');
  hd.addEventListener('pointerdown',e=>{if(!isPhone()||e.target.closest('button'))return;y0=e.clientY;t0=Date.now();hd.setPointerCapture(e.pointerId);});
  hd.addEventListener('pointerup',e=>{if(y0==null)return;const dy=e.clientY-y0;y0=null;const i=ORDER.indexOf(sheet.dataset.mode);
    if(Math.abs(dy)<8)setMode(i===0?'half':'peek');
    else if(dy<0)setMode(ORDER[Math.min(2,i+(dy<-180?2:1))]);
    else setMode(ORDER[Math.max(0,i-(dy>180?2:1))]);});
  hd.addEventListener('pointercancel',()=>{y0=null;});}
/* 在卡片內容上左右滑：換站 */
{let sx=null,sy=0;
  bd.addEventListener('touchstart',e=>{if(!onStation||e.touches.length>1||e.target.closest('.hs')){sx=null;return;}sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  bd.addEventListener('touchend',e=>{if(sx==null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
    if(Math.abs(dx)>70&&Math.abs(dy)<45)go(cur+(dx<0?1:-1));},{passive:true});}

/* ---------- 切換站 ---------- */
const track=$('track');
D.stations.forEach((st,i)=>{const b=document.createElement('button');b.className='stop';b.innerHTML='<span class="yr">'+esc(st.y)+'</span><span class="dot"></span><span class="nm">'+esc(st.t.split('・')[0])+'</span>';b.onclick=()=>go(i);track.appendChild(b);});
function apply(){
  const st=D.stations[cur];
  const onReg=new Set(st.regions.map(regKey)),fadedReg=new Set(st.regions.filter(r=>r.faded).map(regKey));
  /* 國界淡入淡出：要消失的先淡出，新的稍晚一點淡入，看起來像形勢慢慢變過去 */
  Object.keys(regEls).forEach(key=>{const on=polOn&&onReg.has(key),o=on?(fadedReg.has(key)?.35:1):0;
    [regEls[key].sh,regEls[key].top].forEach(e=>{e.classList.toggle('dead',!on);const sel=d3.select(e);
      if(+sel.style('opacity')===o&&!e.__on===!on)return;e.__on=on;
      sel.interrupt().transition().duration(reduce?0:on?800:600).delay(reduce?0:on?180:0).ease(d3.easeCubicInOut).style('opacity',o);});});
  const onLbl=new Set(st.regions.map(r=>r.p+'@'+r.n+'@'+r.at.join(',')));
  Object.keys(lblEls).forEach(key=>lblEls[key].classList.toggle('off',!(polOn&&onLbl.has(key))));
  Object.keys(textLbl).forEach(id=>textLbl[id].classList.toggle('off',!(st.labels||[]).includes(id)));
  Object.keys(placeEls).forEach(id=>placeEls[id].classList.toggle('off',!(st.places||[]).includes(id)));
  arrowEls.forEach((arr,i)=>arr.forEach(g=>g.classList.toggle('off',i!==cur)));
  peopleEls.forEach((arr,i)=>arr.forEach(g=>g.classList.toggle('off',i!==cur)));
  [tradeG,tradeMG].forEach(g=>g.classList.toggle('off',!tradeOn));
  [...track.children].forEach((b,i)=>b.setAttribute('aria-current',String(i===cur)));
  const b=track.children[cur];if(b){const tr=track.getBoundingClientRect(),br=b.getBoundingClientRect();track.scrollLeft=Math.max(0,track.scrollLeft+br.left-tr.left-(tr.width-br.width)/2);}
  $('prev').disabled=cur===0;$('next').disabled=cur===D.stations.length-1;
}
function go(i){const n=Math.max(0,Math.min(D.stations.length-1,i));if(n!==cur){personSel=-1;if(tab==='people'&&!(D.stations[n].people||[]).length)tab='book';}cur=n;userMoved=false;apply();showStation();flyTo(curView());try{history.replaceState(null,'','#'+D.stations[cur].id);}catch(e){}}
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);});
$('lyPol').onclick=()=>{polOn=!polOn;$('lyPol').setAttribute('aria-pressed',String(polOn));apply();};
$('lyTrade').onclick=()=>{tradeOn=!tradeOn;$('lyTrade').setAttribute('aria-pressed',String(tradeOn));apply();showStation();flyTo(curView());};

/* 時間軸高度 → 說明卡位置 */
function layout(){document.documentElement.style.setProperty('--tl-h',document.querySelector('.tl').offsetHeight+'px');}
let rT;addEventListener('resize',()=>{layout();clearTimeout(rT);rT=setTimeout(()=>{vb=camFor(curView());setVB();},120);});

layout();
const start=D.stations.findIndex(s=>'#'+s.id===location.hash);
addEventListener('hashchange',()=>{const i=D.stations.findIndex(s=>'#'+s.id===location.hash);if(i>=0&&i!==cur)go(i);});
cur=start<0?0:start;sheet.dataset.mode='half';apply();showStation();vb=camFor(curView());setVB();
})();
</script>
